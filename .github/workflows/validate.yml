name: Validate LORD XD
on:
  push:
    branches:
      - cypherx-inspired-build-2026-11-05
  pull_request:
    branches:
      - main
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check index.js
      - run: node --check handler.js
      - run: node --check config.js
